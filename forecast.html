<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Parashikimi i Motit</title>

  <meta name="description" content="Parashikimi i motit në kohë reale: temperatura, parashikimi sipas orëve dhe 5-ditor për çdo qytet.">
  <meta name="theme-color" content="#1d6fdc">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Parashikimi i Motit">
  <meta property="og:description" content="Parashikimi i motit në kohë reale: temperatura, parashikimi sipas orëve dhe 5-ditor për çdo qytet.">
  <meta property="og:image" content="img/icon/images-removebg-preview.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="forecast.css">
  <!-- Shënim: konverto këtë ikonë në PNG ose SVG dhe ndrysho type/href -->
  <link rel="icon" href="img/weather-icon-logo-illustration-cloud-with-sun-symbol-template-for-graphic-and-web-design-collection-free-vector.jpg" type="image/jpeg">
</head>
<body id="app-body">

  <noscript>
    <div class="noscript-msg">Kjo faqe kërkon JavaScript për të shfaqur motin. Ju lutem aktivizojeni në shfletues.</div>
  </noscript>

  <!-- EKRANI I MIRËSEARDHJES -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-animation">
        <i class="fas fa-sun sun-anim"></i>
        <i class="fas fa-cloud cloud-anim"></i>
      </div>
      <h2 class="splash-title">Weather Pro</h2>
      <p class="splash-text" id="splash-text">Duke zbuluar lokacionin tuaj...</p>
    </div>
  </div>

  <div class="weather-container">
    <header class="weather-header">
      <h1 id="header-title">Parashikimi i Motit</h1>
      <div class="weather-icon-header">
        <img src="img/icon/images-removebg-preview.png" alt="Weather Icon">
      </div>
    </header>

    <!-- SKELETON LOADING -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none;" role="status" aria-live="polite">
      <div class="skeleton-grid" aria-hidden="true">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <p id="loading-text">Duke u lidhur me satelitin...</p>
    </div>

    <!-- MESAZHI I GABIMIT -->
    <div id="errorBanner" class="error-banner" role="alert" style="display: none;">
      <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
      <span id="errorText"></span>
      <button type="button" id="retryBtn" class="retry-btn"></button>
    </div>

    <main class="weather-main">
      <form id="weatherForm" class="weather-form" style="display: none; position: relative;">
        <div class="input-group">
          <input type="text" id="cityInput" placeholder="Shkruani emrin e qytetit" autocomplete="off" required>
          <button type="submit" id="search-btn">Kërko <i class="fas fa-search"></i></button>
          <button type="button" id="myLocationBtn" class="btn-location" title="Përdor Lokacionin Tim" aria-label="Përdor Lokacionin Tim">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="7"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <line x1="12" y1="1" x2="12" y2="5"></line>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="1" y1="12" x2="5" y2="12"></line>
              <line x1="19" y1="12" x2="23" y2="12"></line>
            </svg>
          </button>
        </div>

        <ul id="suggestionsList" class="suggestions-list" style="display: none;"></ul>

        <select id="locationSelect" class="location-select" style="display: none;">
          <option value="">Zgjidhni qytetin e saktë...</option>
        </select>

        <!-- KËRKIMET E FUNDIT -->
        <div id="recentSearches" class="recent-searches" style="display: none;"></div>
      </form>

      <div class="weather-grid">

        <!-- Karta e Motit Aktual -->
        <div id="weatherResult" class="weather-result" style="display: none;" aria-live="polite">
          <div class="weather-card">
            <h2 id="cityName">Duke kërkuar...</h2>
            <p id="currentDateTime" class="date-time-display"></p>

            <div class="card-tools">
              <span id="updatedAt" class="updated-at"></span>
              <button type="button" id="refreshBtn" class="tool-btn" aria-label="Rifresko"><i class="fas fa-rotate-right" aria-hidden="true"></i></button>
              <div class="unit-toggle" role="group" aria-label="Njësia e temperaturës">
                <button type="button" id="unitC" class="active" aria-pressed="true">°C</button>
                <button type="button" id="unitF" aria-pressed="false">°F</button>
              </div>
            </div>

            <div class="weather-details">
              <div class="temp-icon">
                <img src="img/icon/images-removebg-preview.png" id="weatherIcon" alt="Ikona e Motit Aktual">
                <p id="temperature" class="temperature"></p>
              </div>
              <div class="other-info">
                <p id="humidity"></p>
                <p id="description"></p>
                <p id="wind-speed"></p>
                <p id="feels-like"></p>
                <p id="sunrise"></p>
                <p id="sunset"></p>
                <p id="pressure"></p>
                <p id="visibility"></p>
                <p id="clouds"></p>
                <p id="uv-index"></p>
                <p id="precip"></p>
              </div>
            </div>
          </div>
        </div>

        <!-- Parashikimi 5-Ditor -->
        <div id="forecastContainer" class="forecast-container" style="display: none;">
          <h3 id="forecast-title">Parashikimi 5-Ditor</h3>
          <div id="forecastList" class="forecast-list">
            <!-- Ditët do të gjenerohen nga JavaScript -->
          </div>
        </div>

        <!-- Parashikimi sipas orëve -->
        <div id="hourlyContainer" class="forecast-container hourly-container" style="display: none;">
          <h3 id="hourly-title">Parashikimi sipas orëve</h3>
          <div id="hourlyList" class="hourly-list"></div>
        </div>

      </div>
    </main>

    <footer class="weather-footer">
      <p id="footer-copy">&copy; <span id="year"></span> Parashikimi i Motit. Të gjitha të drejtat e rezervuara.</p>
      <div class="btn">
        <a href="index.html" id="home-link"><i class="fas fa-home"></i> Kthehu në Faqen Kryesore</a>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
